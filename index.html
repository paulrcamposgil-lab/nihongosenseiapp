<link rel="stylesheet" href="css/site.css">
<style>

/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(52px,9vw,104px) 0 clamp(38px,6vw,66px);overflow:hidden}
.hero .wm{
  position:absolute;right:-.16em;top:-.08em;font-family:'Shippori Mincho B1',serif;
  font-size:clamp(15rem,34vw,30rem);line-height:.8;color:var(--pl);opacity:.055;
  pointer-events:none;user-select:none;z-index:0;transition:color .5s ease
}
.hero>.wrap{position:relative;z-index:1}
.tag{
  display:inline-flex;align-items:center;gap:.5em;font-size:.76rem;font-weight:500;
  color:var(--t2);background:var(--card);border:1px solid var(--b);
  padding:.4em .9em;border-radius:999px;margin-bottom:1.7em;
  transition:background-color .5s ease,border-color .5s ease
}
.tag b{color:var(--pl);font-weight:700}

.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:1.9em}
/* X · la fila de las dos tiendas, debajo del botón grande y sin competir con él. */
.cta-mini{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:.95em 0 0;font-size:.85rem;color:var(--t2)}
.cta-mini a{display:inline-flex;align-items:center;gap:.4em;color:var(--t1);text-decoration:none;
  border-bottom:1px solid var(--b);padding-bottom:1px}
.cta-mini a:hover{border-bottom-color:var(--pl)}
.cta-mini .glyph{width:15px;height:15px}
.btn{
  display:inline-flex;align-items:center;gap:.55em;text-decoration:none;
  font-size:.94rem;font-weight:700;padding:.82em 1.5em;border-radius:12px;
  border:1px solid transparent;cursor:pointer;font-family:inherit;
  transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease
}
.btn-1{background:var(--pl);color:var(--bg);box-shadow:0 6px 22px color-mix(in srgb,var(--pl) 30%,transparent)}
.btn:hover{transform:translateY(-2px)}
.glyph{width:18px;height:18px;fill:currentColor;flex-shrink:0;margin-top:-1px}
.btn:focus-visible{outline:2px solid var(--pl);outline-offset:3px}

section{padding:clamp(54px,8.5vw,100px) 0;border-top:1px solid var(--b);transition:border-color .5s ease;position:relative;overflow:hidden}
.wrap{position:relative;z-index:1}
/* Cada sección lleva el kanji de lo que dice. No es adorno: 書 escribir,
   則 regla, 聴 escuchar, 鍛 forjar, 色 color, 無 nada, 始 empezar. */
.swm{
  position:absolute;top:50%;transform:translateY(-50%);
  font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;
  font-size:clamp(9rem,23vw,17rem);line-height:.78;color:var(--pl);opacity:.045;
  pointer-events:none;user-select:none;z-index:0;transition:color .5s ease
}
.swm.l{left:-.11em}
.swm.r{right:-.11em}
.swm.c{left:50%;transform:translate(-50%,-50%)}
.swm.top{top:0;transform:translateY(-16%)}
.swm.bot{top:auto;bottom:0;transform:translateY(18%)}
@media(max-width:829px){.swm{opacity:.035}}
.two{display:grid;grid-template-columns:1fr;gap:clamp(28px,5vw,54px);align-items:center}
@media(min-width:830px){.two{grid-template-columns:1fr 1fr}.two.rev>div:first-child{order:2}}
/* BUG del móvil: los hijos de un grid llevan min-width:auto y no encogen por
   debajo de su contenido; el input de la demo (ya quitada) arrastraba la columna
   y desbordaba a 390px. min-width:0 les deja encoger. */
.two>*{min-width:0}
.rules,.nums,.rooms,.skinbig,.cycle{min-width:0;max-width:100%}

/* ---------- mis reglas ---------- */
.rules{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--b);border-radius:18px;overflow:hidden;transition:background-color .5s ease,border-color .5s ease}
.rules li{display:grid;grid-template-columns:1fr 78px;gap:14px;align-items:center;padding:.85em 1.1em}
.rules li+li{border-top:1px solid var(--b)}
.rules .rn{font-size:.9rem;color:var(--t1)}
.rules .rn small{display:block;font-size:.76rem;color:var(--t3);margin-top:.1em}
.bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- cifras ---------- */
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--b);border:1px solid var(--b);border-radius:18px;overflow:hidden;transition:background-color .5s ease,border-color .5s ease}
@media(min-width:720px){.nums{grid-template-columns:repeat(4,1fr)}}
.num{background:var(--card);padding:clamp(18px,3vw,28px);transition:background-color .5s ease}
.num b{display:block;font-family:'Shippori Mincho B1',serif;font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:500;color:var(--t1);line-height:1.05;font-variant-numeric:tabular-nums}
.num span{display:block;font-size:.81rem;color:var(--t3);margin-top:.32em}

/* ---------- ciclo ---------- */
.cycle{list-style:none;margin:0;padding:0}
.cycle li{display:grid;grid-template-columns:66px 1fr;gap:15px;align-items:start;padding:.8em 0}
.cycle li+li{border-top:1px dashed var(--b)}
.cycle .t{font-size:.75rem;font-weight:700;color:var(--t3);letter-spacing:.05em;font-variant-numeric:tabular-nums;padding-top:.25em}
.cycle .w{font-size:1rem;color:var(--t1)}
.cycle .w small{display:block;font-size:.82rem;color:var(--t3);margin-top:.12em;font-weight:400}
.cycle li.beep .w{color:var(--pl);font-weight:700}

.without{display:flex;flex-wrap:wrap;gap:9px;margin-top:.3em}
.chip{font-size:.85rem;font-weight:500;color:var(--t2);border:1px solid var(--b);border-radius:999px;padding:.42em 1em;transition:border-color .5s ease}
.chip b{color:var(--t1);font-weight:700}

.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
.room{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:19px;transition:background-color .5s ease,border-color .5s ease,transform .18s ease}
.room:hover{transform:translateY(-3px)}
.room .k{font-family:'Shippori Mincho B1',serif;font-size:1.45rem;color:var(--pl);line-height:1;margin-bottom:.42em;display:block;transition:color .5s ease}
.room p{margin:0;font-size:.87rem}

.skinbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px;margin-top:1.5em}
.sb{cursor:pointer;text-align:left;font-family:inherit;border:1px solid var(--b);border-radius:16px;padding:15px;background:var(--sw-bg);color:var(--sw-t);transition:transform .18s ease,box-shadow .18s ease}
.sb:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.sb:focus-visible{outline:2px solid var(--pl);outline-offset:3px}
.sb .dot{width:32px;height:8px;border-radius:99px;background:var(--sw-p);display:block;margin-bottom:.85em}
.sb .n{font-family:'Shippori Mincho B1',serif;font-size:1.1rem;display:block}
.sb .d{font-size:.76rem;opacity:.6;display:block;margin-top:.1em}
.b-sd{--sw-bg:#1E161C;--sw-p:#EFA3C8;--sw-t:#FFFFFF}
.b-sl{--sw-bg:#FAFAFA;--sw-p:#B84A70;--sw-t:#2B2B2B}
.b-kj{--sw-bg:#0A0E1A;--sw-p:#FF3D9A;--sw-t:#F5F7FF}
.b-yg{--sw-bg:#0B0F0D;--sw-p:#B8B5AA;--sw-t:#F2F1EC}
.b-fd{--sw-bg:#0E1420;--sw-p:#7FB0D8;--sw-t:#F1F6FC}
.b-fl{--sw-bg:#EEF3F8;--sw-p:#33608F;--sw-t:#16233A}
.b-ad{--sw-bg:#1B0D06;--sw-p:#E8814F;--sw-t:#FFF3EA}
.b-al{--sw-bg:#FBF4EC;--sw-p:#C4552B;--sw-t:#2B1A10}

.end{text-align:center}
.end .cta{justify-content:center}
.end .lead{margin-left:auto;margin-right:auto}
.end .slogan{font-family:'Shippori Mincho B1','Hiragino Mincho ProN',Georgia,serif;font-size:1.18rem;color:var(--pl);margin:1.5em auto .1em;letter-spacing:.01em;transition:color .5s ease}
.hero-video{display:flex;justify-content:center;margin:34px 0 8px}
.hero-video video{width:100%;max-width:250px;border-radius:26px;display:block;box-shadow:var(--sh-lg)}
@media (prefers-reduced-motion:reduce){
  .hero-video video{display:none}
  .hero-video{background:url(img/intro_poster.webp) center/contain no-repeat;width:250px;height:448px;border-radius:26px;margin:34px auto 8px}
}
.shots .eyebrow{margin-bottom:.4em}
.shots-row{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 0 6px;scrollbar-width:none}
.shots-row::-webkit-scrollbar{display:none}
.shots-row figure{margin:0;flex:0 0 190px;scroll-snap-align:center}
.shots-row img{width:100%;height:auto;border-radius:18px;display:block;border:1px solid var(--b);box-shadow:var(--sh)}
/* 2.0 · EN ESCRITORIO, LAS DIEZ ENTERAS: dos filas de cinco dentro del ancho de la pagina (la tira
   deslizable salia cortada por la derecha y no se veia que se podia deslizar). En movil sigue la tira. */
@media(min-width:760px){
  .shots-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;overflow:visible;scroll-snap-type:none}
  .shots-row figure{flex:none;min-width:0}
}
.hero-sub{font-size:clamp(1.05rem,2.6vw,1.3rem);color:var(--t2);margin:.35em 0 .2em;font-weight:500}
.cast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:1.4em}
@media(min-width:720px){.cast{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pj{margin:0;background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px 12px 16px;text-align:center}
.pj img{width:100%;max-width:150px;height:auto;display:block;margin:0 auto 8px}
.pj b{display:block;color:var(--t1);font-size:1.05rem}
.pj span{display:block;color:var(--t2);font-size:.88rem;margin-top:.2em}

.shots-row figcaption{font-size:.8rem;color:var(--t3);margin-top:10px;line-height:1.4;text-wrap:pretty}
</style>
</head>

<header>
  <div class="wrap hrow">
    <a class="mark" href="#top" aria-label="Nihongo Sensei">
      <span class="tree" aria-hidden="true"><i class="ic-s"></i><i class="ic-a"></i><i class="ic-f"></i><i class="ic-k"></i><i class="ic-y"></i></span>

    });
  };
  window.NS_AFTER_LANG = function(L){
    lang = L;
    pintaCapturas();
  };

  /* ================= entrada ================= */
  var io = window.IntersectionObserver ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('seen'); io.unobserve(en.target); } });
  }, {rootMargin:'0px 0px -8% 0px'}) : null;

  document.querySelectorAll('.rev-in').forEach(function(el, n){
    if(!io){ el.classList.add('seen'); return; }
    el.style.transitionDelay = Math.min(n, 3) * 70 + 'ms';
    io.observe(el);
  });
})();
</script>
<script src="js/site.js"></script>
</body>
