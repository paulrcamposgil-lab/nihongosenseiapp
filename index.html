<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<script>/* anti-parpadeo: estampa la apariencia (y el idioma) antes de pintar */
try{var s=localStorage.getItem("ns-skin");if(s)document.documentElement.setAttribute("data-appearance",s);
var l=localStorage.getItem("ns-lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<link rel="stylesheet" href="css/site.css">
<style>

/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(52px,9vw,104px) 0 clamp(38px,6vw,66px);overflow:hidden}
.hero .wm{
  position:absolute;right:-.16em;top:-.08em;font-family:'Shippori Mincho B1',serif;
  font-size:clamp(15rem,34vw,30rem);line-height:.8;color:var(--pl);opacity:.055;
  pointer-events:none;user-select:none;z-index:0;transition:color .5s ease
}
.hero>.wrap{position:relative;z-index:1}
.tag{
  display:inline-flex;align-items:center;gap:.5em;font-size:.76rem;font-weight:500;
  color:var(--t2);background:var(--card);border:1px solid var(--b);
  padding:.4em .9em;border-radius:999px;margin-bottom:1.7em;
  transition:background-color .5s ease,border-color .5s ease
}
.tag b{color:var(--pl);font-weight:700}

.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:1.9em}
.btn{
  display:inline-flex;align-items:center;gap:.55em;text-decoration:none;
  font-size:.94rem;font-weight:700;padding:.82em 1.5em;border-radius:12px;
  border:1px solid transparent;cursor:pointer;font-family:inherit;
  transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease
}
.btn-1{background:var(--pl);color:var(--bg);box-shadow:0 6px 22px color-mix(in srgb,var(--pl) 30%,transparent)}
.btn-2{background:transparent;color:var(--t1);border-color:var(--b)}
.btn:hover{transform:translateY(-2px)}
.glyph{width:18px;height:18px;fill:currentColor;flex-shrink:0;margin-top:-1px}
.btn:focus-visible{outline:2px solid var(--pl);outline-offset:3px}

/* ---------- ejercicio ---------- */
.drill{
  background:var(--card);border:1px solid var(--b);border-radius:20px;
  box-shadow:var(--sh-lg);padding:clamp(20px,4vw,30px);max-width:530px;
  min-width:0;width:100%;
  transition:background-color .5s ease,border-color .5s ease
}
.drill-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.35em;gap:12px}
.drill-lbl{font-size:.69rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);font-variant-numeric:tabular-nums}
.drill-ask{font-size:.85rem;color:var(--t2);margin:0 0 .28em}
.drill-word{font-family:'Shippori Mincho B1',serif;font-size:clamp(2rem,5.5vw,2.7rem);line-height:1.2;margin:0 0 .04em;color:var(--t1)}
.drill-rom{font-size:.81rem;color:var(--t3);margin:0 0 1.15em;letter-spacing:.03em}
.drill-form{display:flex;gap:9px}
input[type=text]{
  flex:1;min-width:0;font-family:inherit;font-size:1.12rem;color:var(--t1);
  background:var(--card2);border:1px solid var(--b);border-radius:12px;padding:.7em .9em;
  transition:border-color .2s ease,background-color .5s ease,box-shadow .2s ease
}
input[type=text]::placeholder{color:var(--t3)}
input[type=text]:focus{outline:none;border-color:var(--pl);box-shadow:0 0 0 3px var(--ps)}
.go{
  font-family:inherit;font-size:.89rem;font-weight:700;cursor:pointer;
  background:var(--pl);color:var(--bg);border:none;border-radius:12px;padding:0 1.15em;
  transition:opacity .16s ease
}
.go:hover{opacity:.87}
.go:focus-visible{outline:2px solid var(--pl);outline-offset:3px}
.hint{font-size:.75rem;color:var(--t3);margin:.7em 0 0}

.fb{margin-top:1.05em;border-radius:14px;padding:.95em 1.05em;font-size:.91rem;display:none}
.fb.on{display:block;animation:rise .34s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb-head{font-weight:700;font-size:.83rem;margin-bottom:.45em;display:flex;gap:.5em;align-items:baseline;flex-wrap:wrap}
.fb.ok{background:color-mix(in srgb,var(--green) 12%,var(--card2));border:1px solid color-mix(in srgb,var(--green) 32%,transparent)}
.fb.ok .fb-head{color:var(--green)}
.fb.no{background:color-mix(in srgb,var(--red) 10%,var(--card2));border:1px solid color-mix(in srgb,var(--red) 26%,transparent)}
.fb.no .fb-head{color:var(--red)}
.fb.typo{background:color-mix(in srgb,var(--warn) 11%,var(--card2));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.fb.typo .fb-head{color:var(--warn)}
.fb .rule{color:var(--t1);margin:0 0 .62em;line-height:1.55;font-size:.9rem}
.fb .rule em{font-style:normal;font-weight:700;letter-spacing:.08em;font-size:.76rem;color:var(--t3);text-transform:uppercase;margin-right:.45em}
.fb .sib{font-size:.88rem;color:var(--t2);margin:0;letter-spacing:.01em}
.fb .sib b{color:var(--pl);font-weight:700}
.strike{color:var(--t3);text-decoration:line-through;text-decoration-thickness:1px;font-weight:400}
.next{margin-top:.85em;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-size:.84rem;font-weight:700;color:var(--pl)}
.next:focus-visible{outline:2px solid var(--pl);outline-offset:3px}

section{padding:clamp(54px,8.5vw,100px) 0;border-top:1px solid var(--b);transition:border-color .5s ease;position:relative;overflow:hidden}
.wrap{position:relative;z-index:1}
/* Cada sección lleva el kanji de lo que dice. No es adorno: 書 escribir,
   則 regla, 聴 escuchar, 鍛 forjar, 色 color, 無 nada, 始 empezar. */
.swm{
  position:absolute;top:50%;transform:translateY(-50%);
  font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;
  font-size:clamp(9rem,23vw,17rem);line-height:.78;color:var(--pl);opacity:.045;
  pointer-events:none;user-select:none;z-index:0;transition:color .5s ease
}
.swm.l{left:-.11em}
.swm.r{right:-.11em}
.swm.c{left:50%;transform:translate(-50%,-50%)}
.swm.top{top:0;transform:translateY(-16%)}
.swm.bot{top:auto;bottom:0;transform:translateY(18%)}
@media(max-width:829px){.swm{opacity:.035}}
.two{display:grid;grid-template-columns:1fr;gap:clamp(28px,5vw,54px);align-items:center}
@media(min-width:830px){.two{grid-template-columns:1fr 1fr}.two.rev>div:first-child{order:2}}
/* BUG del móvil: los hijos de un grid llevan min-width:auto y no encogen por
   debajo de su contenido; el input arrastraba la columna y desbordaba a 390px.
   min-width:0 les deja encoger; overflow-wrap parte las palabras largas. */
.two>*{min-width:0}
.drill,.rules,.nums,.rooms,.skinbig,.cycle{min-width:0;max-width:100%}
.drill-form{min-width:0}
.fb,.fb-head,.fb .rule,.fb .sib{overflow-wrap:anywhere}

/* ---------- mis reglas ---------- */
.rules{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--b);border-radius:18px;overflow:hidden;transition:background-color .5s ease,border-color .5s ease}
.rules li{display:grid;grid-template-columns:1fr 78px;gap:14px;align-items:center;padding:.85em 1.1em}
.rules li+li{border-top:1px solid var(--b)}
.rules .rn{font-size:.9rem;color:var(--t1)}
.rules .rn small{display:block;font-size:.76rem;color:var(--t3);margin-top:.1em}
.bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- cifras ---------- */
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--b);border:1px solid var(--b);border-radius:18px;overflow:hidden;transition:background-color .5s ease,border-color .5s ease}
@media(min-width:720px){.nums{grid-template-columns:repeat(4,1fr)}}
.num{background:var(--card);padding:clamp(18px,3vw,28px);transition:background-color .5s ease}
.num b{display:block;font-family:'Shippori Mincho B1',serif;font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:500;color:var(--t1);line-height:1.05;font-variant-numeric:tabular-nums}
.num span{display:block;font-size:.81rem;color:var(--t3);margin-top:.32em}

/* ---------- ciclo ---------- */
.cycle{list-style:none;margin:0;padding:0}
.cycle li{display:grid;grid-template-columns:66px 1fr;gap:15px;align-items:start;padding:.8em 0}
.cycle li+li{border-top:1px dashed var(--b)}
.cycle .t{font-size:.75rem;font-weight:700;color:var(--t3);letter-spacing:.05em;font-variant-numeric:tabular-nums;padding-top:.25em}
.cycle .w{font-size:1rem;color:var(--t1)}
.cycle .w small{display:block;font-size:.82rem;color:var(--t3);margin-top:.12em;font-weight:400}
.cycle li.beep .w{color:var(--pl);font-weight:700}

.without{display:flex;flex-wrap:wrap;gap:9px;margin-top:.3em}
.chip{font-size:.85rem;font-weight:500;color:var(--t2);border:1px solid var(--b);border-radius:999px;padding:.42em 1em;transition:border-color .5s ease}
.chip b{color:var(--t1);font-weight:700}

.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
.room{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:19px;transition:background-color .5s ease,border-color .5s ease,transform .18s ease}
.room:hover{transform:translateY(-3px)}
.room .k{font-family:'Shippori Mincho B1',serif;font-size:1.45rem;color:var(--pl);line-height:1;margin-bottom:.42em;display:block;transition:color .5s ease}
.room p{margin:0;font-size:.87rem}

.skinbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px;margin-top:1.5em}
.sb{cursor:pointer;text-align:left;font-family:inherit;border:1px solid var(--b);border-radius:16px;padding:15px;background:var(--sw-bg);color:var(--sw-t);transition:transform .18s ease,box-shadow .18s ease}
.sb:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.sb:focus-visible{outline:2px solid var(--pl);outline-offset:3px}
.sb .dot{width:32px;height:8px;border-radius:99px;background:var(--sw-p);display:block;margin-bottom:.85em}
.sb .n{font-family:'Shippori Mincho B1',serif;font-size:1.1rem;display:block}
.sb .d{font-size:.76rem;opacity:.6;display:block;margin-top:.1em}
.b-sd{--sw-bg:#1E161C;--sw-p:#EFA3C8;--sw-t:#FFFFFF}
.b-sl{--sw-bg:#FAFAFA;--sw-p:#B84A70;--sw-t:#2B2B2B}
.b-kj{--sw-bg:#0A0E1A;--sw-p:#FF3D9A;--sw-t:#F5F7FF}
.b-fd{--sw-bg:#0E1420;--sw-p:#7FB0D8;--sw-t:#F1F6FC}
.b-fl{--sw-bg:#EEF3F8;--sw-p:#33608F;--sw-t:#16233A}

.end{text-align:center}
.end .cta{justify-content:center}
.end .lead{margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <a class="mark" href="#top" aria-label="Nihongo Sensei">
      <span class="tree" aria-hidden="true"><i class="ic-s"></i><i class="ic-f"></i><i class="ic-k"></i></span>
      <span class="name">Nihongo Sensei</span>
    </a>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="es" aria-pressed="true">ES</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="skins" role="group" aria-label="Apariencia">
        <button class="skin s-sd" data-set="sakura-dark"  aria-label="Sakura · dark"></button>
        <button class="skin s-sl" data-set="sakura-light" aria-label="Sakura · light"></button>
        <button class="skin s-kj" data-set="kaiju"        aria-label="Kaiju"></button>
        <button class="skin s-fd" data-set="fuyu-dark"    aria-label="Fuyu · dark"></button>
        <button class="skin s-fl" data-set="fuyu-light"   aria-label="Fuyu · light"></button>
      </div>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <div class="wm" aria-hidden="true">語</div>
  <div class="wrap">
    <span class="tag rev-in" data-t="tag"></span>
    <h1 class="rev-in" data-t="h1"></h1>
    <p class="lead rev-in" data-t="lead"></p>
    <div class="cta rev-in">
      <a class="btn btn-1" href="https://apps.apple.com/app/id6789333985" data-t="cta1"></a>
      <a class="btn btn-2" href="#probar" data-t="cta2"></a>
    </div>
  </div>
</div>

<section id="probar">
  <span class="swm l top" aria-hidden="true">話</span>
  <div class="wrap two">
    <div class="rev-in">
      <span class="eyebrow" data-t="s1eye"></span>
      <h2 data-t="s1h"></h2>
      <p data-t="s1p1"></p>
      <p data-t="s1p2"></p>
    </div>

    <div class="drill rev-in">
      <div class="drill-top">
        <span class="drill-lbl" data-t="dlbl"></span>
        <span class="drill-lbl" id="counter">1 / 5</span>
      </div>
      <p class="drill-ask" data-t="dask"></p>
      <p class="drill-word jp" id="word">のみます</p>
      <p class="drill-rom" id="rom"></p>

      <form class="drill-form" id="form">
        <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="respuesta">
        <button class="go" type="submit" data-t="dgo"></button>
      </form>
      <p class="hint" data-t="dhint"></p>

      <div class="fb" id="fb" role="status" aria-live="polite">
        <div class="fb-head" id="fbhead"></div>
        <p class="rule" id="fbrule"></p>
        <p class="sib" id="fbsib"></p>
        <button class="next" id="next" type="button" data-t="dnext"></button>
      </div>
    </div>
  </div>
</section>

<section>
  <span class="swm r top" aria-hidden="true">則</span>
  <div class="wrap two rev">
    <div class="rev-in">
      <span class="eyebrow" data-t="s2eye"></span>
      <h2 data-t="s2h"></h2>
      <p data-t="s2p1"></p>
      <p data-t="s2p2"></p>
    </div>
    <div class="rev-in">
      <ul class="rules">
        <li><span class="rn" data-t="r1"></span><span class="bar"><i style="width:88%;background:var(--m5)"></i></span></li>
        <li><span class="rn" data-t="r2"></span><span class="bar"><i style="width:71%;background:var(--m4)"></i></span></li>
        <li><span class="rn" data-t="r3"></span><span class="bar"><i style="width:46%;background:var(--m3)"></i></span></li>
        <li><span class="rn" data-t="r4"></span><span class="bar"><i style="width:22%;background:var(--m2)"></i></span></li>
      </ul>
    </div>
  </div>
</section>

<section>
  <div class="wrap rev-in">
    <div class="nums">
      <div class="num"><b>994</b><span data-t="n1"></span></div>
      <div class="num"><b>966</b><span data-t="n2"></span></div>
      <div class="num"><b>25</b><span data-t="n3"></span></div>
      <div class="num"><b>0</b><span data-t="n4"></span></div>
    </div>
  </div>
</section>

<section>
  <span class="swm l top" aria-hidden="true">聴</span>
  <div class="wrap two">
    <div class="rev-in">
      <span class="eyebrow" data-t="s3eye"></span>
      <h2 data-t="s3h"></h2>
      <p data-t="s3p1"></p>
      <p data-t="s3p2"></p>
    </div>
    <div class="rev-in">
      <ol class="cycle">
        <li><span class="t">0,0 s</span><span class="w jp">およぎます<small data-t="c1"></small></span></li>
        <li class="beep"><span class="t">2,4 s</span><span class="w">bip · bip<small data-t="c2"></small></span></li>
        <li class="beep"><span class="t">5,0 s</span><span class="w">biiip<small data-t="c3"></small></span></li>
        <li><span class="t">5,3 s</span><span class="w"><span data-t="c4w"></span><small data-t="c4"></small></span></li>
        <li><span class="t">7,7 s</span><span class="w jp">かえります<small data-t="c5"></small></span></li>
      </ol>
    </div>
  </div>
</section>

<section>
  <div class="wrap rev-in">
    <span class="eyebrow" data-t="s8eye"></span>
    <h2 data-t="s8h"></h2>
    <div class="rooms">
      <div class="room"><span class="k">今</span><h3 data-t="tb1h"></h3><p data-t="tb1p"></p></div>
      <div class="room"><span class="k">課</span><h3 data-t="tb2h"></h3><p data-t="tb2p"></p></div>
      <div class="room"><span class="k">練</span><h3 data-t="tb3h"></h3><p data-t="tb3p"></p></div>
      <div class="room"><span class="k">書</span><h3 data-t="tb4h"></h3><p data-t="tb4p"></p></div>
      <div class="room"><span class="k">道</span><h3 data-t="tb5h"></h3><p data-t="tb5p"></p></div>
    </div>
  </div>
</section>

<section>
  <span class="swm r top" aria-hidden="true">鍛</span>
  <div class="wrap rev-in">
    <span class="eyebrow" data-t="s4eye"></span>
    <h2 data-t="s4h"></h2>
    <div class="rooms">
      <div class="room"><span class="k">動</span><h3 data-t="rm1h"></h3><p data-t="rm1p"></p></div>
      <div class="room"><span class="k">形</span><h3 data-t="rm2h"></h3><p data-t="rm2p"></p></div>
      <div class="room"><span class="k">文</span><h3 data-t="rm3h"></h3><p data-t="rm3p"></p></div>
      <div class="room"><span class="k">仮</span><h3 data-t="rm4h"></h3><p data-t="rm4p"></p></div>
      <div class="room"><span class="k">耳</span><h3 data-t="rm5h"></h3><p data-t="rm5p"></p></div>
      <div class="room"><span class="k">数</span><h3 data-t="rm6h"></h3><p data-t="rm6p"></p></div>
    </div>
  </div>
</section>

<section>
  <span class="swm l top" aria-hidden="true">色</span>
  <div class="wrap two">
    <div class="rev-in">
      <span class="eyebrow" data-t="s5eye"></span>
      <h2 data-t="s5h"></h2>
      <p data-t="s5p1"></p>
      <p data-t="s5p2"></p>
    </div>
    <div class="rev-in">
      <div class="skinbig">
        <button class="sb b-sd" data-set="sakura-dark"><span class="dot"></span><span class="n">桜 · 夜</span><span class="d" data-t="sk1"></span></button>
        <button class="sb b-sl" data-set="sakura-light"><span class="dot"></span><span class="n">桜 · 昼</span><span class="d" data-t="sk2"></span></button>
        <button class="sb b-kj" data-set="kaiju"><span class="dot"></span><span class="n">怪獣</span><span class="d" data-t="sk3"></span></button>
        <button class="sb b-fd" data-set="fuyu-dark"><span class="dot"></span><span class="n">冬 · 夜</span><span class="d" data-t="sk4"></span></button>
        <button class="sb b-fl" data-set="fuyu-light"><span class="dot"></span><span class="n">冬 · 雪</span><span class="d" data-t="sk5"></span></button>
      </div>
    </div>
  </div>
</section>

<section>
  <span class="swm r top" aria-hidden="true">無</span>
  <div class="wrap narrow rev-in">
    <span class="eyebrow" data-t="s6eye"></span>
    <h2 data-t="s6h"></h2>
    <div class="without">
      <span class="chip" data-t="w1"></span>
      <span class="chip" data-t="w2"></span>
      <span class="chip" data-t="w3"></span>
      <span class="chip" data-t="w4"></span>
      <span class="chip" data-t="w5"></span>
      <span class="chip" data-t="w6"></span>
    </div>
    <p style="margin-top:1.6em" data-t="s6p"></p>
  </div>

  var ITEMS = [
    { w:'のみます', ok:'のんで',
      rom:{es:'nomimasu · beber', en:'nomimasu · to drink'},

                  en:'You dropped ます and added て, which is the Group II move. 飲みます is Group I, and there the syllable before ます changes first.'},
        'のって':{es:'って es de い・ち・り. La sílaba de 飲みます es み, y み・び・に hacen んで.',
                  en:'って belongs to い・ち・り. The syllable in 飲みます is み, and み・び・に make んで.'}

      rom:{es:'kakimasu · escribir', en:'kakimasu · to write'},

  var i = 0;
  var elW = document.getElementById('word');
  var elR = document.getElementById('rom');
  var elC = document.getElementById('counter');
  var elA = document.getElementById('ans');
  var fb  = document.getElementById('fb');
  var fbH = document.getElementById('fbhead');
  var fbR = document.getElementById('fbrule');
  var fbS = document.getElementById('fbsib');

  function norm(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,'').replace(/[。、.,\-_]/g,''); }

  function resolve(it, raw){
    var v = norm(raw);
    if(/^[a-z]+$/.test(v) && it.map[v]) return it.map[v];
    return (raw||'').trim().replace(/\s+/g,'');
  }

  function paint(){
    var it = ITEMS[i];
    elW.textContent = it.w;
    elR.textContent = it.rom[lang];
    elC.textContent = (i+1) + ' / ' + ITEMS.length;
    elA.value = '';
    elA.placeholder = it.ok;
    fb.className = 'fb';
  }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var it = ITEMS[i], t = T[lang];
    var v = resolve(it, elA.value);
    if(!v){ elA.focus(); return; }

    if(v === it.ok){
      fb.className = 'fb ok on';
      fbH.innerHTML = '✓ ' + t.fbok;
      fbR.innerHTML = '';
      fbS.innerHTML = it.sib;
    } else if(it.typo.indexOf(v) > -1){
      fb.className = 'fb typo on';
      fbH.innerHTML = '≈ ' + t.fbtypo + ' &nbsp;<span class="strike">' + v + '</span>';
      fbR.innerHTML = t.typoRule;
      fbS.innerHTML = it.sib;
    } else if(it.wrong[v]){
      fb.className = 'fb no on';
      fbH.innerHTML = '✗ ' + it.ok + ' &nbsp;<span class="strike">' + v + '</span>';
      fbR.innerHTML = '<em>' + t.ruleLbl + '</em>' + it.wrong[v][lang];
      fbS.innerHTML = it.sib;
    } else {
      fb.className = 'fb no on';
      fbH.innerHTML = '✗ ' + it.ok + ' &nbsp;<span class="strike">' + v + '</span>';
      fbR.textContent = t.unknown;
      fbS.innerHTML = it.sib;
    }
  });

  document.getElementById('next').addEventListener('click', function(){
    i = (i + 1) % ITEMS.length;
    paint(); elA.focus();
  });


  /* ================= idioma · el motor vive en site.js ================= */
  /* site.js (compartido con las hijas) aplica el idioma. Aquí solo se le
     entregan las cadenas de la portada y un gancho para repintar el
     ejercicio cuando se cambia de idioma. */
  window.NS_STRINGS = T;
  window.NS_AFTER_LANG = function(L){
    lang = L;
    elA.setAttribute('aria-label', L === 'es' ? 'Tu respuesta' : 'Your answer');
    paint();
  };

  /* ================= entrada ================= */
  var io = window.IntersectionObserver ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('seen'); io.unobserve(en.target); } });
  }, {rootMargin:'0px 0px -8% 0px'}) : null;

  document.querySelectorAll('.rev-in').forEach(function(el, n){
    if(!io){ el.classList.add('seen'); return; }
    el.style.transitionDelay = Math.min(n, 3) * 70 + 'ms';
    io.observe(el);
  });
})();
